name: CI

on:
    push:
        branches-ignore:  
            - "ga-ignore-*"
    pull_request: 
        branches:
            - main


env:
    MIRROR_URL: "git@github.com:EpitechPGE3-2026/G-SVR-500-PAR-5-1-survivor-2.git"

jobs:
    push-to-mirror:
        if: github.repository == 'aludnier/ProfilsActif-mirror'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: "actions/checkout@v4"
              with:
                fetch-depth: 0

            - name: Push to Epitech Repository
              uses: pixta-dev/repository-mirroring-action@v1
              with:
                target_repo_url: ${{ env.MIRROR_URL }}
                ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}

