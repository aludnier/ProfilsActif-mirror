name: CI

on:
    push:
        branches-ignore:  
            - "ga-ignore-*"
    pull_request: 
        branches:
            - main


env:
    MIRROR_URL: "git@github.com:EpitechPGE3-2026/G-SVR-500-PAR-5-1-survivor-2.git"

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: |
                      compétenceplus/apps/web/package-lock.json
                      compétenceplus/apps/api/package-lock.json

            - name: Install web dependencies
              working-directory: compétenceplus/apps/web
              run: npm install

            - name: Build web app
              working-directory: compétenceplus/apps/web
              run: npm run build

            - name: Install api dependencies
              working-directory: compétenceplus/apps/api
              run: npm install

            - name: Build api app
              working-directory: compétenceplus/apps/api
              run: npm run build

            - name: Upload build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: app-build
                  path: |
                      compétenceplus/apps/web/dist
                      compétenceplus/apps/api/dist
                  if-no-files-found: warn

    push-to-mirror:
        needs: build
        if: github.repository == 'aludnier/ProfilsActif-mirror'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: "actions/checkout@v4"
              with:
                fetch-depth: 0

            - name: Push to Epitech Repository
              uses: pixta-dev/repository-mirroring-action@v1
              with:
                target_repo_url: ${{ env.MIRROR_URL }}
                ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}

